description: An experienced Analyst skilled in working with diverse data sources and transforming complex datasets into actionable insights. I bring strong problem‑solving abilities, keen attention to detail, and clear communication when presenting insights to non‑technical stakeholders. Proficient in statistical analysis, data mining, and visualization, I uncover trends and valuable insights that support informed decision‑making. I also develop predictive models to strengthen business strategy and performance. With practical finance experience in budgeting, forecasting, financial analysis, and variance analysis, I combine analytical depth with commercial awareness. My technical toolkit includes Excel, SQL, Power BI, and advanced data manipulation. Dedicated and detail‑oriented, I specialise in leveraging data to drive business decisions and deliver meaningful analytical solutions.
